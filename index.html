<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 25px;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 12px;
}

.status {
  color: #777;
  margin-top: 8px;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 14px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.4;
}

.zero {
  background: #111820;
  border: 1px solid #26313b;
}

.user {
  background: #252525;
  margin-left: auto;
}

.controls {
  padding: 15px;
  border-top: 1px solid #222;
  background: #080808;
}

.row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 15px;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

button {
  padding: 15px 18px;
  border: 0;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

.send {
  background: white;
  color: black;
}

.mic {
  width: 100%;
  margin-top: 10px;
  background: #111820;
  color: white;
  border: 1px solid #333;
}

button:active {
  transform: scale(0.97);
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">ZERO</div>
  <div class="status">ONLINE</div>
</header>

<div id="chat">
  <div class="message zero">
    Hello. I am ZERO. What's on your mind?
  </div>
</div>

<div class="controls">

  <div class="row">
    <input
      id="input"
      type="text"
      placeholder="Talk to ZERO..."
      onkeydown="if(event.key === 'Enter') send()"
    >

    <button class="send" onclick="send()">SEND</button>
  </div>

  <button class="mic" onclick="listen()">
    🎙️ TALK TO ZERO
  </button>

</div>

</div>

<script>

const BRAIN_URL = "https://zero-2ytu.onrender.com/chat";

function addMessage(text, type) {

  const chat = document.getElementById("chat");

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


async function send() {

  const input = document.getElementById("input");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  addMessage("Thinking...", "zero");

  try {

    const response = await fetch(BRAIN_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    if (!response.ok) {
      throw new Error("Server error");
    }

    const data = await response.json();

    const messages =
      document.querySelectorAll(".message.zero");

    const thinking =
      messages[messages.length - 1];

    thinking.textContent =
      data.reply || "I didn't get a response.";

  } catch (error) {

    const messages =
      document.querySelectorAll(".message.zero");

    const thinking =
      messages[messages.length - 1];

    thinking.textContent =
      "I can't connect to my brain right now.";

    console.error(error);
  }
}


function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Voice recognition isn't supported in this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-GB";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;

      document.getElementById("input").value = text;

      send();
    };

  recognition.start();
}

</script>

</body>
</html>
