<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 25px;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 12px;
}

.status {
  color: #777;
  margin-top: 8px;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 14px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 85%;
}

.zero {
  background: #111820;
  border: 1px solid #26313b;
}

.user {
  background: #252525;
  margin-left: auto;
}

.controls {
  padding: 15px;
  border-top: 1px solid #222;
}

.row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 15px;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 12px;
  font-size: 16px;
}

button {
  padding: 15px 18px;
  border: 0;
  border-radius: 12px;
  font-weight: bold;
}

.send {
  background: white;
  color: black;
}

.mic {
  width: 100%;
  margin-top: 10px;
  background: #111820;
  color: white;
  border: 1px solid #333;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">ZERO</div>
  <div class="status">ONLINE</div>
</header>

<div id="chat">
  <div class="message zero">
    Hello. I am ZERO.
  </div>
</div>

<div class="controls">
  <div class="row">
    <input id="input" placeholder="Talk to ZERO...">
    <button class="send" onclick="send()">SEND</button>
  </div>

  <button class="mic" onclick="listen()">🎙️ TALK TO ZERO</button>
</div>

</div>

<script>
function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage("I'm ready. My AI brain will be connected next.", "zero");
  }, 400);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition isn't supported here.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-GB";
  recognition.continuous = false;

  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("input").value =
      event.results[0][0].transcript;

    send();
  };
}
</script>

</body>
</html>
